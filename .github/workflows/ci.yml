name: Frontend CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: frontend-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-typecheck-test-build:
    name: lint, typecheck, vitest, build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4 # reads the pinned version from package.json's "packageManager"

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Generate Next.js route types
        # `LayoutProps<...>`/`PageProps<...>` (app/layout.tsx,
        # app/(shell)/projects/[projectId]/layout.tsx) are ambient globals
        # Next.js writes into `.next/types/` — generated as a side effect of
        # `next dev`/`next build`, or here explicitly, since a fresh CI
        # checkout has no `.next/` yet and `pnpm typecheck` (bare `tsc
        # --noEmit`) doesn't build anything itself to produce them first.
        run: pnpm exec next typegen

      - name: Typecheck
        run: pnpm typecheck

      - name: Vitest
        run: pnpm test

      - name: Build
        run: pnpm build

  e2e:
    name: Playwright (real backend, no mocks)
    runs-on: ubuntu-latest
    # Was 20; Ollama install + a cache-miss model pull adds a few minutes on
    # top of the steps that were already here — give that room rather than
    # let the outer job timeout be what fires (cue-eval.yml's own reasoning
    # for its much larger budget).
    timeout-minutes: 25
    env:
      # Same default docker-compose.yml/pytest.yml already use for the
      # ephemeral CI Postgres container's password — not a secret.
      CUE_APP_DB_PASSWORD: cue_app
      # e2e/living-wip.spec.ts's write-back spec drives a real
      # POST .../writeback/draft, which calls app/writeback/compose.py's
      # compose_draft — get_client("reasoning"), which defaults to Ollama
      # (app/llm/config.py) with no mock/fake seam in the real running app
      # (only tests/conftest.py's fixtures inject a FakeModelClient, and this
      # job deliberately runs the real app, not pytest). Nothing here ever
      # started Ollama, so that call 500'd with a connection-refused
      # httpx.ConnectError in under a second, the draft never got created,
      # and the spec's 120s wait for "Draft — not yet sent" just ran out the
      # clock waiting for text that was never coming — confirmed by
      # reproducing OllamaClient.complete() against a closed port locally
      # (same "nothing listening" condition this job was actually in),
      # which raises immediately, not after any timeout. Deterministic, not
      # flaky: reappears on every run until Ollama actually exists here.
      #
      # Local dev's own default `reasoning_model` is qwen2.5:32b (CLAUDE.md's
      # own "Diagnostic only" tier, not "Local dev/offline") — too large to
      # pull/run on every push the way cue-eval.yml's dedicated, much less
      # frequent workflow can justify for qwen2.5:14b. Overriding just this
      # role to the same 14b model already proven to run acceptably in
      # Actions (cue-eval.yml) is this job's own judgment call: real
      # generation from a real local model, not the exact production-parity
      # model, which is the right trade for a job that runs on every push.
      CUE_LLM_REASONING_MODEL: qwen2.5:14b
    steps:
      # Two sibling checkouts, not one — e2e/global-setup.ts seeds real data
      # by shelling out to backend/scripts/seed_dev_data.py at `../../backend`
      # relative to this repo's own `e2e/` dir, the same relative layout a
      # local `frontend/` + `backend/` checkout has. Both repos are public,
      # so the default GITHUB_TOKEN needs no extra scope for the second
      # checkout.
      - uses: actions/checkout@v4
        with:
          path: frontend

      - uses: actions/checkout@v4
        with:
          repository: spottsmeng/cue-backend
          path: backend

      - name: Install uv
        uses: astral-sh/setup-uv@v9.0.0

      - name: Install backend dependencies
        working-directory: backend
        run: uv sync

      - name: Start backend's Postgres/MinIO/Valkey
        # Reuses docker-compose.yml directly (not a native Actions service
        # container), same reasoning backend/.github/workflows/pytest.yml's
        # own comment gives: db/init/01-create-app-role.sql only runs via
        # docker-entrypoint-initdb.d, which a bare service container skips.
        working-directory: backend
        run: docker compose up -d --wait

      - name: Apply backend migrations
        # Unlike pytest.yml (tests/conftest.py migrates cue_test itself),
        # this job runs the real app against the real `cue` database, so
        # migrations have to be applied explicitly first — backend/README.md's
        # own "For the running app" step.
        working-directory: backend
        run: uv run alembic upgrade head

      # Real backend, real LLM calls — same "no mocks of anything that
      # matters" line this job's own name draws, extended to the one write-
      # back spec that needs a real drafted message, not a canned string.
      # Mirrors backend/.github/workflows/cue-eval.yml's own install/start/
      # pull/warm-up steps exactly (that workflow already proved this
      # sequence works on an Actions runner); qwen2.5:14b specifically
      # because CUE_LLM_REASONING_MODEL above already pins the backend to it
      # instead of the much heavier 32b local default.
      - name: Cache Ollama model blobs
        uses: actions/cache@v4
        with:
          path: ~/.ollama/models
          key: ollama-models-qwen2.5-14b-v1

      - name: Install Ollama
        run: curl -fsSL https://ollama.com/install.sh | sh

      - name: Start Ollama (unprivileged, not the installer's systemd unit)
        # Same reasoning as cue-eval.yml's identical step: the installer
        # auto-starts a systemd unit running as its own `ollama` user, which
        # would store models outside ~/.ollama/models for the `runner` user
        # this job's own cache step above actually keys on.
        run: |
          sudo systemctl disable --now ollama 2>/dev/null || true
          ollama serve > /tmp/ollama.log 2>&1 &
          for i in $(seq 1 30); do
            curl -sf http://localhost:11434/ > /dev/null && exit 0
            sleep 2
          done
          echo "Ollama did not become ready in time" >&2
          cat /tmp/ollama.log >&2
          exit 1

      - name: Pull qwen2.5:14b
        run: ollama pull qwen2.5:14b

      - name: Warm up the model
        # cue-eval.yml's own note applies verbatim: `ollama pull` only
        # downloads weights, it doesn't load them into memory — paying that
        # one-off cold-load cost here, with its own generous timeout, keeps
        # it off the Playwright spec's own 120s wait budget. keep_alive
        # matches OllamaClient's own "2h" so it stays resident for the rest
        # of this job.
        run: |
          curl -sf http://localhost:11434/api/generate \
            --max-time 600 \
            -d '{"model":"qwen2.5:14b","prompt":"hi","stream":false,"keep_alive":"2h"}' \
            > /dev/null

      - name: Start the backend API
        working-directory: backend
        run: |
          nohup uv run fastapi run main.py --port 8000 > /tmp/cue-backend.log 2>&1 &
          for i in $(seq 1 30); do
            curl -sf http://localhost:8000/health > /dev/null && exit 0
            sleep 1
          done
          echo "backend did not become healthy in time" >&2
          cat /tmp/cue-backend.log >&2
          exit 1

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          # Default `package_json_file: package.json` is relative to
          # $GITHUB_WORKSPACE root, which is empty here — this job checks
          # out into `frontend/`/`backend/` subdirectories (two sibling
          # repos, not one), so the action can't find a "packageManager"
          # field to read the version from without being told where.
          package_json_file: frontend/package.json

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install frontend dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Install Playwright's Chromium
        working-directory: frontend
        run: pnpm exec playwright install --with-deps chromium

      - name: Run the Playwright suite
        working-directory: frontend
        env:
          NEXT_PUBLIC_CUE_API_URL: http://localhost:8000
          AUTH_SECRET: ci-only-insecure-secret-not-a-real-deployment
        run: pnpm test:e2e

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 14
